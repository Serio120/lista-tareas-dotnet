name: .NET

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      - name: Restore dependencies
        run: dotnet restore tests/ListaTareas.Tests.csproj

      - name: Build application
        run: dotnet build lista-tareas-dotnet.csproj --configuration Release --no-restore

      - name: Run unit tests
        run: dotnet test tests/ListaTareas.Tests.csproj --configuration Release --no-restore --verbosity normal
